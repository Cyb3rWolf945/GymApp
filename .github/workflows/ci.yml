name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: dev
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_pkg=true" >> "$GITHUB_OUTPUT"; else echo "has_pkg=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm test

      - name: No workspace yet
        if: steps.detect.outputs.has_pkg != 'true'
        run: echo "No package.json yet — scaffold arrives with issue 1."
