name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MODEL_PROFILE: dev
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_pkg=true" >> "$GITHUB_OUTPUT"; else echo "has_pkg=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.has_pkg == 'true'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm test

      - name: Admin build
        if: steps.detect.outputs.has_pkg == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: pnpm --filter admin build

      - name: E2E build (fake Supabase URL)
        if: steps.detect.outputs.has_pkg == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
        run: pnpm --filter e2e build:web

      - name: Playwright browser
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright, web build, MODEL_PROFILE=dev)
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm --filter e2e test

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report

      - name: Web export
        if: steps.detect.outputs.has_pkg == 'true'
        run: pnpm --filter mobile exec expo export --platform web

      - name: No workspace yet
        if: steps.detect.outputs.has_pkg != 'true'
        run: echo "No package.json yet — scaffold arrives with issue 1."
