# Minimal Supabase CLI config (supabase init layout). Run `supabase start` / `supabase db reset` locally.
project_id = "gymapp"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

# The admin backoffice requires TOTP two-factor sign-in.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
