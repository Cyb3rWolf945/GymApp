<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" style="color-scheme: dark light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0B10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)" />
    <title>%WEB_TITLE%</title>
    <script>try{var p=localStorage.getItem('fuelift.theme');if(p==='dark'||p==='light')document.documentElement.dataset.scheme=p}catch(e){}</script>
    <style id="expo-reset">
html,body{height:100%}
body{overflow:hidden}
#root{display:flex;height:100%;flex:1}
    </style>
    <style id="page-theme">
html,body,#root{color-scheme:dark;background-color:#0A0B10}
@media (prefers-color-scheme: light){html:not([data-scheme]),html:not([data-scheme]) body,html:not([data-scheme]) #root{color-scheme:light;background-color:#F5F6FA}}
html[data-scheme="light"],html[data-scheme="light"] body,html[data-scheme="light"] #root{color-scheme:light;background-color:#F5F6FA}
html[data-scheme="dark"],html[data-scheme="dark"] body,html[data-scheme="dark"] #root{color-scheme:dark;background-color:#0A0B10}
    </style>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
