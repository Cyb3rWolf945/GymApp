<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Splash mark on a transparent background; the splash colour (#0A0B10) comes from app.json. Kept small enough to stay
       inside the circle Android 12 crops the splash icon to. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6FF3D"/>
      <stop offset="1" stop-color="#5BE3B0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
    <rect x="212" y="212" width="600" height="600" rx="150" fill="url(#brand)"/>
    <rect x="212" y="212" width="600" height="600" rx="150" fill="url(#shine)"/>
    <path d="M384 318 H668 V402 H476 V470 H636 V552 H476 V706 H384 Z" fill="#0A0B10" stroke="#0A0B10" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="650" cy="652" r="46" fill="#6D5BFF"/>
  </g>
</svg>
